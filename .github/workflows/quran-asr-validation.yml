name: Validate Quran ASR integration

on:
  push:
    branches: [feat/quran-asr-engine, feat/tajweed-quran-site, feat/ultimate-quran-experience]
  pull_request:
    branches: [feat/tajweed-quran-site]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Check service worker JavaScript syntax
        run: node --check service-worker.js
      - name: Validate web app manifest
        run: python -c "import json; json.load(open('manifest.webmanifest', encoding='utf-8'))"
      - name: Check ASR API Python syntax
        run: python -m py_compile asr-api/app.py
